<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alberto's Pizza | Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <img src="logo/Alberto's Pizza.png" class="logo-img" alt="Alberto's Pizza Logo">

  <div class="nav-links">
    <a href="#">HOME</a>
    <a href="signup.html" class="nav-btn">SIGN UP</a>
    <!-- <button onclick="loginAlert()">LOG IN</button> -->
    <a href="login.html">LOG IN</a>
  </div>
</header>


<!-- MAIN CONTENT -->
<div class="container">

  <!-- LEFT: MENU GROUP -->
  <section class="menu-group">
    
    <div class="big-image">
      <img id="bigPreview" src="" alt="Pizza Preview">
    </div>

    <h2 id="pizzaName">Select a Pizza</h2>
    <p id="ingredients">Ingredients will appear here</p>
    
    <div class="menu-scroll">

      <h3>BESTSELLERS</h3>
      <img src="menu/Bestsellers/Pizza Supreme.png"
          class="menu-img"
          onclick="selectPizza('Pizza Supreme', this.src)">

      <img src="menu/Bestsellers/Hawaiian.png"
          class="menu-img"
          onclick="selectPizza('Hawaiian', this.src)">

      <h3>KIDDIE'S FAVORITES</h3>
      <img src="menu/Kiddie's Favorites/Cookies n' Cheese.png"
          class="menu-img"
          onclick="selectPizza('Cookies n Cheese', this.src)">

      <img src="menu/Kiddie's Favorites/Creamy Cheese.png"
          class="menu-img"
          onclick="selectPizza('Creamy Cheese', this.src)">

    </div>

  </section>

  <!-- RIGHT: ORDER GROUP -->
  <section class="order-group">

    <h3>PIZZA ORDER</h3>

    <label>Pizza:</label>
    <select id="pizzaSelect" onchange="updatePrice()">
      <option value="">Choose a pizza...</option>
      <option>Pizza Supreme</option>
      <option>Hawaiian</option>
      <option>Cookies n Cheese</option>
      <option>Creamy Cheese</option>
    </select>

    <label>Size:</label>
    <input type="radio" name="size" value="9" checked onclick="updatePrice()"> 9"
    <input type="radio" name="size" value="11" onclick="updatePrice()"> 11"

    <label>Cheese:</label>
    <input type="radio" name="cheese" value="Quickmelt" checked onclick="updatePrice()"> Quickmelt
    <input type="radio" name="cheese" value="Mozzarella" onclick="updatePrice()"> Mozzarella

    <label>Quantity:</label>
    <input type="number" id="qty" min="1" value="1" onchange="updatePrice()">

    <label>Current Price:</label>
    <input type="text" id="price" readonly value="0">

    <div class="btn-row">
      <button onclick="clearPizzaForm()">CLEAR</button> <!-- WALA PANIII-->
      <button onclick="addToOrder()">ADD</button>
    </div>

    <!-- ORDER TABLE -->
    <h3>ORDER</h3>
    <table id="orderTable">
      <tr>
        <th>ITEM</th><th>SIZE</th><th>CHEESE</th>
        <th>PRICE</th><th>QNTY</th><th>OVERALL</th><th>ACTION</th>
      </tr>
    </table>

    <button class="clear-order" onclick="clearOrder()">CLEAR ORDER</button>

    <!-- CUSTOMER INFO -->
    <h3>CUSTOMER INFO</h3>
    <input type="text" value="Guest" readonly>
    <input type="text" id="contact" placeholder="Contact Number">

    <span class="optional-label">Optional</span>
    <input
      type="email"
      id="optionalEmail"
      placeholder="Email address"
    >

    <select id="branch">
      <option>Sogod, Southern Leyte</option>
      <option>Cebu City</option>
      <option>Maasin City</option>
    </select>

    <div>
      <label>ORDER:</label>
      <input type="radio" name="orderType" checked> PICK-UP
      <input type="radio" name="orderType"> DELIVERY
    </div>

    <div>
      <label>PAYMENT:</label>
      <input type="radio" name="payment" checked> CASH
      <input type="radio" name="payment"> GCASH
    </div>

    <div class="btn-row">
      <button onclick="cancelAll()">CANCEL ORDER</button>
      <button onclick="finalizeOrder()">FINALIZE ORDER</button>
    </div>

  </section>
</div>

<script src="js/home.js"></script>
</body>
</html>
