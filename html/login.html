<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alberto's Pizza | Log In</title>

  <!-- Reuse existing CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <img src="logo/Alberto's Pizza.png" class="logo-img" alt="Alberto's Pizza Logo">

  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="signup.html">SIGN UP</a>
    <a href="login.html" class="nav-btn">LOG IN</a>
  </div>
</header>

<!-- LOGIN CONTAINER -->
<div class="signup-wrapper">

  <div class="signup-card">

    <!-- LEFT SIDE (INFO) -->
    <div class="signup-info">
      <h2>Log in</h2>

      <p>
        Log in to your <strong>Alberto’s Pizza</strong> account to continue
        ordering and track your purchases.
      </p>

      <p class="terms-text">
        By continuing, you agree to our
        <a href="#" onclick="termsAlert(); return false;">Terms &amp; Conditions</a>
        and
        <a href="#" onclick="privacyAlert(); return false;">Privacy Notice</a>.
      </p>

      <p class="login-link">
        Don’t have an account?
        <a href="signup.html">Create Account</a>
      </p>
    </div>

    <!-- RIGHT SIDE (FORM) -->
    <div class="signup-form">

      <label>Username *</label>
      <input
        type="text"
        id="loginUsername"
        placeholder="Enter your username"
      >

      <label>Password *</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
      >

      <button class="create-account-btn" onclick="loginUser()">
        Log In
      </button>

    </div>

  </div>
</div>

<!-- JS -->
<script src="js/home.js"></script>

</body>
</html>
